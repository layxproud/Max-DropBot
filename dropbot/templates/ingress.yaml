apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dropbot
spec:
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: /f/
            pathType: Prefix
            backend:
              service:
                name: bot
                port:
                  number: 8080

          - path: /minio/
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
