services:
  bot:
    build: .
    container_name: my-bot
    restart: always
    env_file: ".env"
    volumes:
      - ./logs:/app/logs
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_started

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    env_file: ".env"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot

volumes:
  minio-data:
  redis-data:
